{{- if .Values.survival.enabled }}
{{- range $worldName, $worldConfig := .Values.survival.worlds }}
{{- if $worldConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
  labels:
    app: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
spec:
  replicas: {{ $worldConfig.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
  template:
    metadata:
      labels:
        app: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
    spec:
      {{- with $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spigot
          {{- if $.Values.development.enabled }}
          image: {{ $.Values.images.spigot.repository }}:{{ (index $.Values.images.survival $worldName).tag }}
          {{- else }}
          image: {{ $.Values.images.spigot.repository }}:{{ $.Values.images.spigot.tag }}
          {{- end }}
          imagePullPolicy: {{ $.Values.images.spigot.pullPolicy }}
          tty: true
          stdin: true
          workingDir: /srv/minecraft
          env:
            - name: FORWARDING_SECRET
              valueFrom:
                secretKeyRef:
                  name: velocity-forwarding-secret
                  key: forwarding.secret
          volumeMounts:
            {{- if not $.Values.development.disableGitPuller }}
            - name: worldfiles
              mountPath: /srv/minecraft/banned-ips.json
              subPath: banned-ips.json
            - name: worldfiles
              mountPath: /srv/minecraft/banned-players.json
              subPath: banned-players.json
            - name: worldfiles
              mountPath: /srv/minecraft/bukkit.yml
              subPath: bukkit.yml
            - name: worldfiles
              mountPath: /srv/minecraft/commands.yml
              subPath: commands.yml
            - name: worldfiles
              mountPath: /srv/minecraft/help.yml
              subPath: help.yml
            - name: worldfiles
              mountPath: /srv/minecraft/ops.json
              subPath: ops.json
            - name: worldfiles
              mountPath: /srv/minecraft/permissions.yml
              subPath: permissions.yml
            - name: worldfiles
              mountPath: /srv/minecraft/plugins
              subPath: plugins
            - name: worldfiles
              mountPath: /srv/minecraft/server.properties
              subPath: server.properties
            - name: worldfiles
              mountPath: /srv/minecraft/spigot.yml
              subPath: spigot.yml
            - name: worldfiles
              mountPath: /srv/minecraft/usercache.json
              subPath: usercache.json
            - name: worldfiles
              mountPath: /srv/minecraft/whitelist.json
              subPath: whitelist.json
            - name: worldfiles
              mountPath: /srv/minecraft/world
              subPath: world
            - name: worldfiles
              mountPath: /srv/minecraft/world_nether
              subPath: world_nether
            - name: worldfiles
              mountPath: /srv/minecraft/world_the_end
              subPath: world_the_end
            {{- end }}
            - name: config-output
              mountPath: /srv/minecraft/config
        - name: refresher
          image: {{ $.Values.images.utils.repository }}:{{ $.Values.images.utils.tag }}
          workingDir: /srv/utils
          env:
            - name: GIT_COMMITTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
                  key: git-committer-name
            - name: GIT_COMMITTER_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
                  key: git-committer-email
            - name: MINECRAFT_SERVER_PATH
              value: /srv/minecraft
          command: ["python"]
          args: ["-m", "flask", "run"]
          volumeMounts:
            - name: worldfiles
              mountPath: /srv/minecraft
      initContainers:
        - name: config-setup
          image: busybox
          env:
            - name: FORWARDING_SECRET
              valueFrom:
                secretKeyRef:
                  name: velocity-forwarding-secret
                  key: forwarding.secret
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config-output
              mountPath: /output
          command:
            - sh
            - -c
            - |
              echo "Processing paper-global.yml..."
              cp /template/paper-global.yml /output/paper-global.yml
              sed -i "s/REPLACE_SECRET_HERE/$FORWARDING_SECRET/g" /output/paper-global.yml
              echo "Config processed. Secret replaced with: $FORWARDING_SECRET"
              echo "Final config:"
              cat /output/paper-global.yml
        {{- if not $.Values.development.disableGitPuller }}
        - name: gitpuller
          image: {{ $.Values.images.utils.repository }}:{{ $.Values.images.utils.tag }}
          workingDir: /srv/minecraft
          env:
            - name: GITURL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
                  key: git-url
            - name: GITUSER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
                  key: git-user
            - name: GITTOKEN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
                  key: git-token
          command: ["/bin/sh"]
          args:
            [
              "-c",
              "if [ -d .git ]; then echo 'already cloned'; else git clone https://$(GITUSER):$(GITTOKEN)@$(GITURL) .; fi",
            ]
          volumeMounts:
            - name: worldfiles
              mountPath: /srv/minecraft
        {{- end }}
      volumes:
        - name: worldfiles
          emptyDir: {}
        - name:  config-template
          configMap:
            name: general-survival-config
        - name: config-output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
spec:
  type: NodePort
  ports:
    - protocol: TCP
      port: {{ $worldConfig.service.port }}
  selector:
    app: {{ include "manifests.fullname" $ }}-survival-{{ $worldName }}
{{- end }}
{{- end }}
{{- end }} 