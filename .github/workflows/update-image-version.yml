name: Update Image Version

on:
  repository_dispatch:
    types: [update-image-version]
  workflow_call:
    inputs:
      image_type:
        required: true
        type: string
      version:
        required: true
        type: string
      source_repo:
        required: false
        type: string
        default: 'marcstreeter/minecraft-project'
      commit_sha:
        required: false
        type: string
      pr_number:
        required: false
        type: string
      run_id:
        required: false
        type: string
      triggered_by:
        required: false
        type: string

env:
  TARGET_BRANCH: master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.action || inputs.image_type }}
  cancel-in-progress: true

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      
      - name: Extract event data
        id: extract
        run: |
          # Handle both repository_dispatch and workflow_call
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            IMAGE_TYPE="${{ github.event.client_payload.image_type }}"
            NEW_VERSION="${{ github.event.client_payload.version }}"
            SOURCE_REPO="${{ github.event.client_payload.source_repo }}"
            SOURCE_COMMIT="${{ github.event.client_payload.commit_sha }}"
            SOURCE_PR="${{ github.event.client_payload.pr_number }}"
            SOURCE_RUN_ID="${{ github.event.client_payload.run_id }}"
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
          else
            IMAGE_TYPE="${{ inputs.image_type }}"
            NEW_VERSION="${{ inputs.version }}"
            SOURCE_REPO="${{ inputs.source_repo }}"
            SOURCE_COMMIT="${{ inputs.commit_sha }}"
            SOURCE_PR="${{ inputs.pr_number }}"
            SOURCE_RUN_ID="${{ inputs.run_id }}"
            TRIGGERED_BY="${{ inputs.triggered_by }}"
          fi
          
          echo "Received version update request:"
          echo "  Image type: $IMAGE_TYPE"
          echo "  New version: $NEW_VERSION"
          echo "  Source repo: $SOURCE_REPO"
          echo "  Source commit: $SOURCE_COMMIT"
          echo "  Source PR: $SOURCE_PR"
          echo "  Source workflow run: $SOURCE_RUN_ID"
          echo "  Triggered by: $TRIGGERED_BY"
          
          # Validate image type
          case "$IMAGE_TYPE" in
            proxy|spigot|utils)
              echo "✓ Valid image type: $IMAGE_TYPE"
              ;;
            *)
              echo "✗ Unknown image type: $IMAGE_TYPE"
              echo "   Valid types: proxy, spigot, utils"
              exit 1
              ;;
          esac
          
          # Export to env for subsequent steps
          echo "IMAGE_TYPE=$IMAGE_TYPE" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> $GITHUB_ENV
          echo "SOURCE_PR=$SOURCE_PR" >> $GITHUB_ENV
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> $GITHUB_ENV
          echo "TRIGGERED_BY=$TRIGGERED_BY" >> $GITHUB_ENV
      
      - name: Get current version from values.yaml
        id: current
        run: |
          if [[ ! -f manifests/values.yaml ]]; then
            echo "✗ ERROR: manifests/values.yaml not found"
            exit 1
          fi
          
          # Map image type to repository line
          case "$IMAGE_TYPE" in
            proxy)
              REPO_LINE="repository: marcstreeter/proxy"
              ;;
            spigot)
              REPO_LINE="repository: marcstreeter/spigot"
              ;;
            utils)
              REPO_LINE="repository: marcstreeter/utils"
              ;;
          esac
          
          # Extract current version
          CURRENT_VERSION=$(grep -A 1 "$REPO_LINE" manifests/values.yaml | grep "tag:" | sed 's/.*tag: *"\([^"]*\)".*/\1/')
          
          echo "Current $IMAGE_TYPE version: $CURRENT_VERSION"
          echo "New $IMAGE_TYPE version: $NEW_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
      
      - name: Create feature branch
        run: |
          BRANCH_NAME="update-$IMAGE_TYPE-$NEW_VERSION-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "Created branch: $BRANCH_NAME"
      
      - name: Update values.yaml
        run: |
          echo "Updating $IMAGE_TYPE tag from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update the image tag using sed with range addressing
          case "$IMAGE_TYPE" in
            proxy)
              sed -i "/^  proxy:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$NEW_VERSION\"|" manifests/values.yaml
              ;;
            spigot)
              sed -i "/^  spigot:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$NEW_VERSION\"|" manifests/values.yaml
              ;;
            utils)
              sed -i "/^  utils:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$NEW_VERSION\"|" manifests/values.yaml
              ;;
          esac
          
          echo "✓ Updated manifests/values.yaml"
          echo ""
          echo "Modified section:"
          grep -A 2 "^  $IMAGE_TYPE:" manifests/values.yaml
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifests/values.yaml
          
          # Create commit message file with details
          cat > /tmp/commit-msg.txt << EOF
          Update ${IMAGE_TYPE} image to ${NEW_VERSION}
          
          Triggered by: ${SOURCE_REPO}
          Previous version: ${CURRENT_VERSION}
          New version: ${NEW_VERSION}
          Commit: ${SOURCE_COMMIT}
          EOF
          
          # Add optional fields if present
          if [[ -n "$SOURCE_PR" ]] && [[ "$SOURCE_PR" != "null" ]]; then
            echo "PR: #${SOURCE_PR}" >> /tmp/commit-msg.txt
          fi
          
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            echo "Workflow: https://github.com/${SOURCE_REPO}/actions/runs/${SOURCE_RUN_ID}" >> /tmp/commit-msg.txt
          fi
          
          git commit -F /tmp/commit-msg.txt
          echo "✓ Committed changes"
      
      - name: Push feature branch
        run: |
          git push origin $BRANCH_NAME
          echo "✓ Pushed branch: $BRANCH_NAME"
      
      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const imageType = process.env.IMAGE_TYPE;
            const newVersion = process.env.NEW_VERSION;
            const currentVersion = process.env.CURRENT_VERSION;
            const sourceRepo = process.env.SOURCE_REPO;
            const sourceCommit = process.env.SOURCE_COMMIT;
            const sourcePr = process.env.SOURCE_PR;
            const sourceRunId = process.env.SOURCE_RUN_ID;
            const triggeredBy = process.env.TRIGGERED_BY;
            const branchName = process.env.BRANCH_NAME;
            
            // Determine if this is an internal or external update
            const isInternal = sourceRepo.includes('minecraft-project');
            const updateType = isInternal ? 'Internal Build' : 'External Repository';
            
            // Build PR body
            let prBody = `## ${updateType} - Image Version Update\n\n`;
            prBody += `**Image:** \`${imageType}\`\n`;
            prBody += `**Version Change:** \`${currentVersion}\` → \`${newVersion}\`\n\n`;
            
            prBody += `### Source Information\n`;
            prBody += `- **Repository:** ${sourceRepo}\n`;
            
            if (sourceCommit) {
              prBody += `- **Commit:** [\`${sourceCommit.substring(0, 7)}\`](https://github.com/${sourceRepo}/commit/${sourceCommit})\n`;
            }
            
            if (sourcePr && sourcePr !== 'null' && sourcePr !== '') {
              prBody += `- **Pull Request:** [#${sourcePr}](https://github.com/${sourceRepo}/pull/${sourcePr})\n`;
            }
            
            if (sourceRunId) {
              prBody += `- **Workflow Run:** [View logs](https://github.com/${sourceRepo}/actions/runs/${sourceRunId})\n`;
            }
            
            if (triggeredBy) {
              prBody += `- **Triggered by:** @${triggeredBy}\n`;
            }
            
            prBody += `\n---\n`;
            prBody += `*This PR was automatically created by the \`update-image-version\` workflow.*`;
            
            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Update ${imageType} image to ${newVersion}`,
              head: branchName,
              base: '${{ env.TARGET_BRANCH }}',
              body: prBody
            });
            
            console.log(`✓ Created PR #${pullRequest.number}: ${pullRequest.html_url}`);
            core.setOutput('pr_number', pullRequest.number);
            core.setOutput('pr_url', pullRequest.html_url);

