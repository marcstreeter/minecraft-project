name: Update Image Version

on:
  repository_dispatch:
    types: [update-image-version]
  workflow_call:
    inputs:
      image_type:
        required: true
        type: string
      version:
        required: true
        type: string
      source_repo:
        required: false
        type: string
        default: 'marcstreeter/minecraft-project'
      commit_sha:
        required: false
        type: string
      pr_number:
        required: false
        type: string
      run_id:
        required: false
        type: string
      triggered_by:
        required: false
        type: string

env:
  TARGET_BRANCH: master
  UPDATE_BRANCH: update-versions  # Single branch for all version updates

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # Allow parallel updates to accumulate

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract event data
        id: extract
        run: |
          # Handle both repository_dispatch and workflow_call
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            IMAGE_TYPE="${{ github.event.client_payload.image_type }}"
            NEW_VERSION="${{ github.event.client_payload.version }}"
            SOURCE_REPO="${{ github.event.client_payload.source_repo }}"
            SOURCE_COMMIT="${{ github.event.client_payload.commit_sha }}"
            SOURCE_PR="${{ github.event.client_payload.pr_number }}"
            SOURCE_RUN_ID="${{ github.event.client_payload.run_id }}"
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
          else
            IMAGE_TYPE="${{ inputs.image_type }}"
            NEW_VERSION="${{ inputs.version }}"
            SOURCE_REPO="${{ inputs.source_repo }}"
            SOURCE_COMMIT="${{ inputs.commit_sha }}"
            SOURCE_PR="${{ inputs.pr_number }}"
            SOURCE_RUN_ID="${{ inputs.run_id }}"
            TRIGGERED_BY="${{ inputs.triggered_by }}"
          fi
          
          echo "Received version update request:"
          echo "  Image type: $IMAGE_TYPE"
          echo "  New version: $NEW_VERSION"
          echo "  Source repo: $SOURCE_REPO"
          echo "  Source commit: $SOURCE_COMMIT"
          echo "  Source PR: $SOURCE_PR"
          echo "  Source workflow run: $SOURCE_RUN_ID"
          echo "  Triggered by: $TRIGGERED_BY"
          
          # Validate image type
          case "$IMAGE_TYPE" in
            proxy|spigot|utils)
              echo "✓ Valid image type: $IMAGE_TYPE"
              ;;
            *)
              echo "✗ Unknown image type: $IMAGE_TYPE"
              echo "   Valid types: proxy, spigot, utils"
              exit 1
              ;;
          esac
          
          # Export to env for subsequent steps
          echo "IMAGE_TYPE=$IMAGE_TYPE" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> $GITHUB_ENV
          echo "SOURCE_PR=$SOURCE_PR" >> $GITHUB_ENV
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> $GITHUB_ENV
          echo "TRIGGERED_BY=$TRIGGERED_BY" >> $GITHUB_ENV
      
      - name: Setup update branch
        run: |
          # Check if update branch exists remotely
          if git ls-remote --heads origin $UPDATE_BRANCH | grep -q $UPDATE_BRANCH; then
            echo "Update branch exists, checking it out"
            git checkout $UPDATE_BRANCH
            git pull origin $UPDATE_BRANCH
          else
            echo "Creating new update branch from $TARGET_BRANCH"
            git checkout -b $UPDATE_BRANCH origin/$TARGET_BRANCH
          fi
          
          echo "BRANCH_NAME=$UPDATE_BRANCH" >> $GITHUB_ENV
      
      - name: Get current version from values.yaml
        id: current
        run: |
          if [[ ! -f manifests/values.yaml ]]; then
            echo "✗ ERROR: manifests/values.yaml not found"
            exit 1
          fi
          
          # Map image type to repository line
          case "$IMAGE_TYPE" in
            proxy)
              REPO_LINE="repository: marcstreeter/proxy"
              ;;
            spigot)
              REPO_LINE="repository: marcstreeter/spigot"
              ;;
            utils)
              REPO_LINE="repository: marcstreeter/utils"
              ;;
          esac
          
          # Extract current version
          CURRENT_VERSION=$(grep -A 1 "$REPO_LINE" manifests/values.yaml | grep "tag:" | sed 's/.*tag: *"\([^"]*\)".*/\1/')
          
          echo "Current $IMAGE_TYPE version: $CURRENT_VERSION"
          echo "New $IMAGE_TYPE version: $NEW_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          
          # Check if update is needed
          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "No update needed, version already at $NEW_VERSION"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Update needed: $CURRENT_VERSION → $NEW_VERSION"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Update values.yaml
        if: steps.current.outputs.needs_update == 'true'
        run: |
          echo "Updating $IMAGE_TYPE tag from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update the image tag using sed with range addressing
          case "$IMAGE_TYPE" in
            proxy)
              sed -i "/^  proxy:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$NEW_VERSION\"|" manifests/values.yaml
              ;;
            spigot)
              sed -i "/^  spigot:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$NEW_VERSION\"|" manifests/values.yaml
              ;;
            utils)
              sed -i "/^  utils:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$NEW_VERSION\"|" manifests/values.yaml
              ;;
          esac
          
          echo "✓ Updated manifests/values.yaml"
          echo ""
          echo "Modified section:"
          grep -A 2 "^  $IMAGE_TYPE:" manifests/values.yaml
      
      - name: Commit and push changes
        if: steps.current.outputs.needs_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifests/values.yaml
          
          # Create commit message file with details
          cat > /tmp/commit-msg.txt << EOF
          Update ${IMAGE_TYPE} image to ${NEW_VERSION}
          
          Triggered by: ${SOURCE_REPO}
          Previous version: ${CURRENT_VERSION}
          New version: ${NEW_VERSION}
          Commit: ${SOURCE_COMMIT}
          EOF
          
          # Add optional fields if present
          if [[ -n "$SOURCE_PR" ]] && [[ "$SOURCE_PR" != "null" ]]; then
            echo "PR: #${SOURCE_PR}" >> /tmp/commit-msg.txt
          fi
          
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            echo "Workflow: https://github.com/${SOURCE_REPO}/actions/runs/${SOURCE_RUN_ID}" >> /tmp/commit-msg.txt
          fi
          
          git commit -F /tmp/commit-msg.txt
          echo "✓ Committed changes"
          
          # Push to update branch
          git push origin $UPDATE_BRANCH
          echo "✓ Pushed to branch: $UPDATE_BRANCH"
      
      - name: Create or Update Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const updateBranch = process.env.UPDATE_BRANCH;
            const targetBranch = process.env.TARGET_BRANCH;
            
            // Check if PR already exists
            const { data: existingPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${updateBranch}`,
              base: targetBranch,
              state: 'open'
            });
            
            // Get all current versions from values.yaml
            const fs = require('fs');
            const valuesYaml = fs.readFileSync('manifests/values.yaml', 'utf8');
            const proxyMatch = valuesYaml.match(/proxy:[\s\S]*?tag: "([^"]+)"/);
            const spigotMatch = valuesYaml.match(/spigot:[\s\S]*?tag: "([^"]+)"/);
            const utilsMatch = valuesYaml.match(/utils:[\s\S]*?tag: "([^"]+)"/);
            
            const proxyVersion = proxyMatch ? proxyMatch[1] : 'unknown';
            const spigotVersion = spigotMatch ? spigotMatch[1] : 'unknown';
            const utilsVersion = utilsMatch ? utilsMatch[1] : 'unknown';
            
            // Build comprehensive PR body
            let prBody = `## Image Version Updates\n\n`;
            prBody += `This PR contains accumulated version updates for all images.\n\n`;
            prBody += `### Current Versions in this PR\n\n`;
            prBody += `| Image | Version |\n`;
            prBody += `|-------|--------|\n`;
            prBody += `| proxy | \`${proxyVersion}\` |\n`;
            prBody += `| spigot | \`${spigotVersion}\` |\n`;
            prBody += `| utils | \`${utilsVersion}\` |\n`;
            prBody += `\n---\n`;
            prBody += `*This PR is automatically maintained by the \`update-image-version\` workflow.*\n`;
            prBody += `*New updates will be added to this PR automatically. Merge when ready.*`;
            
            if (existingPRs.length > 0) {
              // Update existing PR
              const pr = existingPRs[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: prBody
              });
              console.log(`✓ Updated existing PR #${pr.number}: ${pr.html_url}`);
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_action', 'updated');
            } else {
              // Create new PR
              const { data: newPR } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Update image versions`,
                head: updateBranch,
                base: targetBranch,
                body: prBody
              });
              console.log(`✓ Created new PR #${newPR.number}: ${newPR.html_url}`);
              core.setOutput('pr_number', newPR.number);
              core.setOutput('pr_url', newPR.html_url);
              core.setOutput('pr_action', 'created');
            }

