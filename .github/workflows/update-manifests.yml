name: Update Kubernetes Manifests

on:
  workflow_run:
    workflows: ["build our image"]
    types:
      - completed
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-version-tags:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Just
        run: |
          for i in {1..5}; do
              curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin && break || sleep 5
          done
      
      - name: Get latest versions and update Helm values
        run: |
          # Get latest published versions for all images
          SERVER_VERSION=$(just get-current-image-version marcstreeter/spigot)
          PROXY_VERSION=$(just get-current-image-version marcstreeter/proxy)
          UTILS_VERSION=$(just get-current-image-version marcstreeter/utils)
          
          echo "Latest published versions:"
          echo "  Server: $SERVER_VERSION"
          echo "  Utils: $UTILS_VERSION"
          echo "  Proxy: $PROXY_VERSION"
          echo "Setting Helm values.yaml image tags to most recent published versions"
          
          # Update each image type precisely using range addressing
          sed -i "/^  spigot:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$SERVER_VERSION\"|" manifests/values.yaml
          sed -i "/^  proxy:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$PROXY_VERSION\"|" manifests/values.yaml
          sed -i "/^  utils:/,/^    pullPolicy:/ s|tag: \".*\"|tag: \"$UTILS_VERSION\"|" manifests/values.yaml
          
          # Commit all changes in a single atomic operation
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifests/values.yaml
          git commit -m "Update all image references: server=$SERVER_VERSION, proxy=$PROXY_VERSION, utils=$UTILS_VERSION"
          git push 